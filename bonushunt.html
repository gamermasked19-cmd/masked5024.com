<script>const API='https://masked-slot-call.gamermasked19.workers.dev';
function money(n){return '$'+Number(n||0).toLocaleString('en-NZ',{minimumFractionDigits:2,maximumFractionDigits:2});}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function render(h){const content=document.getElementById('bonusContent');if(!h){document.getElementById('huntStatus').textContent='No active Bonus Hunt yet.';content.innerHTML='<div class="bonus-empty">NO BONUS HUNT LOADED</div>';return;}const b=Array.isArray(h.bonuses)?h.bonuses:[], opened=b.filter(x=>x.opened), cost=b.reduce((a,x)=>a+Number(x.cost||0),0), win=opened.reduce((a,x)=>a+Number(x.win||0),0), profit=win-cost, ret=cost?win/cost*100:0;document.getElementById('huntName').innerHTML=esc(h.name||'MASKED BONUS HUNT').replace(/(BONUS HUNT)/i,'<span>$1</span>');document.getElementById('huntStatus').textContent=h.status==='complete'?'HUNT COMPLETE':h.status==='draft'?'DRAFT HUNT':'LIVE NOW';document.getElementById('statCount').textContent=opened.length+'/'+b.length;document.getElementById('statCost').textContent=money(cost);document.getElementById('statWin').textContent=money(win);document.getElementById('statProfit').textContent=(profit>=0?'+':'')+money(profit);document.getElementById('statReturn').textContent=ret.toFixed(1)+'%';if(!b.length){content.innerHTML='<div class="bonus-empty">NO BONUSES ADDED YET</div>';return;}content.innerHTML='<table class="bonus-table"><thead><tr><th>#</th><th>SLOT</th><th>BET</th><th>COST</th><th>WIN</th><th>X</th><th>STATUS</th></tr></thead><tbody>'+b.map((x,i)=>{const mult=Number(x.bet)>0&&x.opened?Number(x.win||0)/Number(x.bet):0;return '<tr class="'+(x.opened?'opened':'unopened')+'"><td>'+(i+1)+'</td><td><div class="slot-name">'+esc(x.slot||'Unnamed Slot')+'</div>'+(x.casino?'<div class="muted">'+esc(x.casino)+'</div>':'')+'</td><td>'+money(x.bet)+'</td><td>'+money(x.cost)+'</td><td class="bonus-win">'+(x.opened?money(x.win):'—')+'</td><td class="bonus-x">'+(x.opened?mult.toFixed(2)+'x':'—')+'</td><td><span class="bonus-status '+(x.opened?'opened':'locked')+'">'+(x.opened?'OPENED':'LOCKED')+'</span></td></tr>';}).join('')+'</tbody></table>';}
async function load(){try{const r=await fetch(API+'/api/bonus-hunt',{cache:'no-store'});const d=await r.json();render(d.hunt);}catch(e){document.getElementById('bonusContent').innerHTML='<div class="bonus-error">BONUS HUNT TEMPORARILY UNAVAILABLE</div>';}}
load();setInterval(load,3000);document.querySelector('.mobile-menu-toggle')?.addEventListener('click',function(){const n=document.querySelector('.nav nav'),o=n.classList.toggle('mobile-open');this.setAttribute('aria-expanded',o?'true':'false');});
</script></body></html>
