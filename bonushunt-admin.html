<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>MASKED_5024 | BONUS HUNT ADMIN</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600;700;800;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"></head>
<body><header class="site-header"><div class="nav"><a class="brand" href="index.html">MASKED<span>_5024</span></a><nav><a href="bonushunt.html">🎰 BONUS HUNT</a></nav></div></header><main class="bonus-admin"><div class="admin-card"><h2>🎰 BONUS HUNT ADMIN</h2><div class="admin-help">Your existing Cloudflare ADMIN_TOKEN is used. It is never saved into the website files.</div><div class="admin-grid"><div class="admin-field"><label>ADMIN TOKEN</label><input id="token" type="password" placeholder="Enter your admin token"></div><div class="admin-field"><label>HUNT NAME</label><input id="name" value="MASKED BONUS HUNT"></div><div class="admin-field"><label>STATUS</label><select id="status"><option value="live">LIVE</option><option value="draft">DRAFT</option><option value="complete">COMPLETE</option></select></div><div class="admin-field"><label>STARTING BALANCE</label><input id="balance" type="number" step="0.01" value="0"></div></div><div class="admin-actions"><button class="admin-btn primary" id="load">LOAD HUNT</button><button class="admin-btn" id="save">SAVE HUNT</button><button class="admin-btn" id="add">+ ADD BONUS</button><button class="admin-btn danger" id="clear">CLEAR HUNT</button></div><div class="admin-message" id="msg"></div></div><div class="admin-card"><h2>BONUSES</h2><div id="list" class="admin-list"><div class="admin-help">Load the current hunt or add a bonus.</div></div></div></main>
<script>const API='https://masked-slot-call.gamermasked19.workers.dev';let hunt={name:'MASKED BONUS HUNT',status:'live',startingBalance:0,bonuses:[]};const $=id=>document.getElementById(id);function msg(t){$('msg').textContent=t;}function money(n){return Number(n||0).toFixed(2);}function render(){const list=$('list');if(!hunt.bonuses.length){list.innerHTML='<div class="admin-help">No bonuses yet. Click + ADD BONUS.</div>';return;}list.innerHTML=hunt.bonuses.map((b,i)=>'<div class="admin-row"><div class="admin-status">#'+(i+1)+'</div><input data-i="'+i+'" data-k="slot" value="'+esc(b.slot)+'" placeholder="Slot name"><input data-i="'+i+'" data-k="bet" type="number" step="0.01" value="'+money(b.bet)+'" placeholder="Bet"><input data-i="'+i+'" data-k="cost" type="number" step="0.01" value="'+money(b.cost)+'" placeholder="Cost"><input data-i="'+i+'" data-k="win" type="number" step="0.01" value="'+money(b.win)+'" placeholder="Win"><button class="admin-btn '+(b.opened?'primary':'')+'" data-open="'+i+'">'+(b.opened?'OPENED':'OPEN')+'</button><button class="admin-btn danger" data-del="'+i+'">DELETE</button></div>').join('');list.querySelectorAll('input').forEach(el=>el.addEventListener('input',()=>{const i=+el.dataset.i,k=el.dataset.k;hunt.bonuses[i][k]=k==='slot'?el.value:Number(el.value||0);}));list.querySelectorAll('[data-open]').forEach(el=>el.addEventListener('click',()=>{hunt.bonuses[+el.dataset.open].opened=!hunt.bonuses[+el.dataset.open].opened;render();}));list.querySelectorAll('[data-del]').forEach(el=>el.addEventListener('click',()=>{hunt.bonuses.splice(+el.dataset.del,1);render();}));}function esc(v){return String(v??'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}function sync(){hunt.name=$('name').value;hunt.status=$('status').value;hunt.startingBalance=Number($('balance').value||0);}$('add').onclick=()=>{hunt.bonuses.push({id:crypto.randomUUID(),slot:'',casino:'',bet:0,cost:0,opened:false,win:0,note:''});render();};$('load').onclick=async()=>{try{const r=await fetch(API+'/api/bonus-hunt',{cache:'no-store'});const d=await r.json();hunt=d.hunt||{name:'MASKED BONUS HUNT',status:'live',startingBalance:0,bonuses:[]};$('name').value=hunt.name||'';$('status').value=hunt.status||'live';$('balance').value=hunt.startingBalance||0;render();msg('Hunt loaded.');}catch(e){msg('Could not load hunt.');}};$('save').onclick=async()=>{sync();const token=$('token').value.trim();if(!token){msg('Enter your admin token first.');return;}try{const r=await fetch(API+'/api/bonus-hunt',{method:'PUT',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify(hunt)});const d=await r.json();if(!r.ok){msg(d.error||'Save failed.');return;}hunt=d.hunt;render();msg('BONUS HUNT SAVED ✓');}catch(e){msg('Save failed.');}};$('clear').onclick=async()=>{const token=$('token').value.trim();if(!token){msg('Enter your admin token first.');return;}if(!confirm('Clear the entire Bonus Hunt?'))return;const r=await fetch(API+'/api/bonus-hunt',{method:'DELETE',headers:{Authorization:'Bearer '+token}});const d=await r.json();if(!r.ok){msg(d.error||'Clear failed.');return;}hunt={name:'MASKED BONUS HUNT',status:'live',startingBalance:0,bonuses:[]};render();msg('BONUS HUNT CLEARED ✓');};render();</script></body></html>
