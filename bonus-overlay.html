<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bonus Hunt Overlay</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;800;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"></head><body class="overlay-mode"><main class="bonus-hunt-wrap"><section class="bonus-table-card"><div id="bonusContent" class="bonus-empty">LOADING BONUS HUNT...</div></section></main><script>const API='https://masked-slot-call.gamermasked19.workers.dev';function money(n){return '$'+Number(n||0).toLocaleString('en-NZ',{minimumFractionDigits:2,maximumFractionDigits:2});}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}async function load(){try{const r=await fetch(API+'/api/bonus-hunt',{cache:'no-store'}),d=await r.json(),h=d.hunt,b=h?.bonuses||[];if(!h){document.getElementById('bonusContent').innerHTML='<div class="bonus-empty">NO BONUS HUNT</div>';return;}const opened=b.filter(x=>x.opened),win=opened.reduce((a,x)=>a+Number(x.win||0),0),cost=b.reduce((a,x)=>a+Number(x.cost||0),0);document.getElementById('bonusContent').innerHTML='<div style="padding:14px 18px;color:#fff;font:900 16px Orbitron,sans-serif;letter-spacing:1px">'+esc(h.name)+' <span style="float:right;color:#59aaff">'+opened.length+'/'+b.length+' OPENED</span></div><table class="bonus-table"><thead><tr><th>#</th><th>SLOT</th><th>WIN</th><th>X</th><th>STATUS</th></tr></thead><tbody>'+b.map((x,i)=>{const mult=x.opened&&Number(x.bet)>0?Number(x.win||0)/Number(x.bet):0;return '<tr class="'+(x.opened?'opened':'unopened')+'"><td>'+(i+1)+'</td><td class="slot-name">'+esc(x.slot||'Unnamed Slot')+'</td><td class="bonus-win">'+(x.opened?money(x.win):'—')+'</td><td class="bonus-x">'+(x.opened?mult.toFixed(2)+'x':'—')+'</td><td><span class="bonus-status '+(x.opened?'opened':'locked')+'">'+(x.opened?'OPENED':'LOCKED')+'</span></td></tr>';}).join('')+'</tbody></table><div style="padding:10px 18px;color:#7890ad;font:700 9px Orbitron,sans-serif">TOTAL WIN '+money(win)+' • COST '+money(cost)+'</div>';}catch(e){}}load();setInterval(load,3000);</script></body></html>
