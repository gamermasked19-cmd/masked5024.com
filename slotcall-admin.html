<main>
  <section class="section slotcall-section">
    <div class="section-heading">
      <div class="eyebrow">PRIVATE CONTROL</div>
      <h2>SLOT CALL <span>ADMIN</span></h2>
      <p>Use this page to clear the current slot call and the recent request history after your stream.</p>
    </div>

    <div class="admin-card">
      <label for="adminToken">Admin token</label>
      <input id="adminToken" type="password" autocomplete="off" placeholder="Enter your private admin token">
      <button id="clearButton" class="btn primary" type="button">CLEAR SLOT CALL</button>
      <div id="adminMessage" class="admin-message" aria-live="polite"></div>
    </div>
  </section>
</main>

<script>
(function(){
  const API_BASE='https://masked-slot-call.gamermasked19.workers.dev';
  const token=document.getElementById('adminToken');
  const button=document.getElementById('clearButton');
  const message=document.getElementById('adminMessage');

  button.addEventListener('click', async function(){
    message.textContent='Clearing...';
    button.disabled=true;
    try{
      const response=await fetch(API_BASE+'/api/slot-call',{
        method:'DELETE',
        headers:{'Authorization':'Bearer '+token.value}
      });
      if(!response.ok) throw new Error('Could not clear slot call');
      message.textContent='✓ Slot call cleared.';
    }catch(e){
      message.textContent='Could not clear the slot call. Check the token and Worker URL.';
    }finally{
      button.disabled=false;
    }
  });
})();
</script>
